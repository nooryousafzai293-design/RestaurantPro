<div class="page-title">
    <h2>Dashboard</h2>
    <p>Manage your RestaurantPro customers and subscriptions.</p>
</div>

<section class="stats">

    <div class="stat-card">
        <span>Total Restaurants</span>
        <h3 id="totalRestaurants">0</h3>
    </div>

    <div class="stat-card">
        <span>Active</span>
        <h3 id="activeRestaurants">0</h3>
    </div>

    <div class="stat-card">
        <span>Blocked</span>
        <h3 id="blockedRestaurants">0</h3>

    <div class="stat-card">
        <span>Unpaid</span>
        <h3 id="unpaidRestaurants">0</h3>
    </div>

</section>

<section class="section">

    <div class="section-header">
        <h3>➕ Add Restaurant</h3>

        <div class="form-grid">

            <div class="form-group">
                <label>Restaurant Name</label>
                <input

                    id="restaurantName"

                    required
                >
            </div>

            <div class="form-group">
                <label>Owner Name</label>
                <input
                    type="text"
                    id="ownerName"
                    placeholder="Owner name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Login Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="owner@example.com"
                    required
                >
            </div>

            <div class="form-group">
                <label>Login Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 6 characters"
                    minlength="6"
                    required
                >
            </div>

            <div class="form-group">
                <label>Monthly Fee (Rs.)</label>

</main>

<script>

const SUPABASE_URL =
    "https://ryixnwawmtglcibjmhjh.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_zcD4aBCDk1yz8RFD1JoBqA_aToCuo7k";
const FUNCTION_URL =
    SUPABASE_URL + "/functions/v1/bright-responder";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


const messageBox =
    document.getElementById("message");


function showMessage(text, type) {

    messageBox.textContent = text;

    messageBox.className =
        "message " + type;

}


function hideMessage() {

    messageBox.textContent = "";

    messageBox.className =
        "message";

}


async function loadRestaurants() {

    const list =
        document.getElementById("restaurantList");

    list.innerHTML =
        '<div class="loading">Loading restaurants...</div>';

    const {
        data,
        error
    } =
        await supabaseClient
            .from("restaurants")
            .select("*")
            .order("created_at", {
                ascending: false
            });

    if (error) {

        list.innerHTML =
            '<div class="empty-state">Unable to load restaurants.</div>';

        console.error(error);

        return;
    }


    const restaurants = data || [];

    updateStats(restaurants);


    if (restaurants.length === 0) {

        list.innerHTML = `
            <div class="empty-state">
                <div class="icon">🍽️</div>
                <div>No restaurants created yet.</div>
            </div>
        `;

        return;
    }


    list.innerHTML =
        restaurants.map(function (restaurant) {

            const blocked =
                String(restaurant.status).toLowerCase()
                === "blocked";

            const paymentUnpaid =
                String(restaurant.payment_status).toLowerCase()
                === "unpaid";


            return `

                <div class="restaurant-item">

                    <div class="restaurant-name">
                        ${escapeHtml(
                            restaurant.restaurant_name || ""
                        )}
                    </div>

                    <div class="restaurant-detail">
                        Owner:
                        ${escapeHtml(
                            restaurant.owner_name || ""
                        )}
                    </div>

                    <div class="restaurant-detail">
                        Login:
                        ${escapeHtml(
                            restaurant.username || ""
                        )}
                    </div>

                    <div class="restaurant-detail">
                        Monthly Fee:
                        Rs.
                        ${Number(
                            restaurant.monthly_fee || 0
                        ).toLocaleString()}
                    </div>

                    <div class="restaurant-detail">
                        Subscription:
                        ${restaurant.subscription_start || "-"}
                        to
                        ${restaurant.subscription_expiry || "-"}
                    </div>

                    <div class="restaurant-detail">
                        Status:
                        <span class="${
                            blocked
                            ? "status-blocked"
                            : "status-active"
                        }">
                            ${
                                blocked
                                ? "Blocked"
                                : "Active"
                            }
                        </span>
                    </div>

                    <div class="restaurant-detail">
                        Payment:
                        <span class="${
                            paymentUnpaid
                            ? "payment-unpaid"
                            : "payment-paid"
                        }">
                            ${
                                restaurant.payment_status || "-"
                            }
                        </span>
                    </div>

                    <div class="restaurant-actions">

                        <button
                            class="${
                                blocked
                                ? "unblock-btn"
                                : "block-btn"
                            }"
                            onclick="toggleRestaurant(
                                '${restaurant.id}',
                                ${blocked}
                            )"
                        >
                            ${
                                blocked
                                ? "Unblock"
                                : "Block"
                            }
                        </button>

                    </div>

                </div>

            `;

        }).join("");

}


function updateStats(restaurants) {

    const total =
        restaurants.length;

    const active =
        restaurants.filter(function (r) {

            return String(r.status).toLowerCase()
                === "active";

        }).length;

    const blocked =
        restaurants.filter(function (r) {

            return String(r.status).toLowerCase()
                === "blocked";

        }).length;

    const unpaid =
        restaurants.filter(function (r) {

            return String(r.payment_status).toLowerCase()
                === "unpaid";

        }).length;


    document.getElementById(
        "totalRestaurants"
    ).textContent = total;

    document.getElementById(
        "activeRestaurants"
    ).textContent = active;

    document.getElementById(
        "blockedRestaurants"
    ).textContent = blocked;

    document.getElementById(
        "unpaidRestaurants"
    ).textContent = unpaid;

}


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


document
    .getElementById("restaurantForm")
    .addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            hideMessage();


            const button =
                document.getElementById(
                    "createButton"
                );

            button.disabled = true;

            button.textContent =
                "Creating...";


            try {

                const payload = {

                    restaurantName:
                        document.getElementById(
                            "restaurantName"
                        ).value.trim(),

                    ownerName:
                        document.getElementById(
                            "ownerName"
                        ).value.trim(),

                    email:
                        document.getElementById(
                            "email"
                        ).value.trim()
                        .toLowerCase(),

                    password:
                        document.getElementById(
                            "password"
                        ).value,

                    monthlyFee:
                        Number(
                            document.getElementById(
                                "monthlyFee"
                            ).value
                        ) || 0,

                    subscriptionStart:
                        document.getElementById(
                            "subscriptionStart"
                        ).value,

                    subscriptionExpiry:
                        document.getElementById(
                            "subscriptionExpiry"
                        ).value

                };


                if (
                    payload.password.length < 6
                ) {

                    throw new Error(
                        "Password must be at least 6 characters."
                    );

                }


                const response =
                    await fetch(
                        FUNCTION_URL,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    payload
                                )
                        }
                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        result.error ||
                        "Restaurant creation failed."
                    );

                }


                showMessage(
                    "Restaurant created successfully! Login account has also been created.",
                    "success"
                );


                document
                    .getElementById(
                        "restaurantForm"
                    )
                    .reset();


                await loadRestaurants();


            } catch (error) {

                console.error(error);

                showMessage(
                    error.message ||
                    "Something went wrong.",
                    "error"
                );

            } finally {

                button.disabled = false;

                button.textContent =
                    "Create Restaurant";

            }

        }
    );


async function toggleRestaurant(
    restaurantId,
    isBlocked
) {

    const newStatus =
        isBlocked
        ? "active"
        : "blocked";


    const {
        error
    } =
        await supabaseClient
            .from("restaurants")
            .update({
                status: newStatus
            })
            .eq("id", restaurantId);


    if (error) {

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

        return;
    }


    showMessage(
        "Restaurant status updated.",
        "success"
    );


    await loadRestaurants();

}


document
    .getElementById("logoutButton")
    .addEventListener(
        "click",
        async function () {

            localStorage.removeItem(
                "restaurantpro_admin_logged_in"
            );

            await supabaseClient.auth.signOut();

            window.location.href =
                "admin-login.html";

        }
    );


document.addEventListener(
    "DOMContentLoaded",
    function () {

        loadRestaurants();

    }
);

</script>

</body>
