<body>

<header class="header">

    <div class="brand">
        <div class="brand-icon">🍽️</div>

        <div>
            <h1>RestaurantPro</h1>

    </div>

    <button
        class="logout-btn"
        type="button"
        onclick="logoutAdmin()"
    >
        Logout

</header>

<main class="container">

    <div class="page-title">
        <h2>Dashboard</h2>

        <p>
            Manage your RestaurantPro customers and subscriptions.
        </p>
    </div>

    <div id="errorMessage" class="error-message"></div>
    <div id="successMessage" class="success-message"></div>

    <!-- STATS -->

    <section class="stats">

        <div class="stat-card">
            <span>Total Restaurants</span>
            <h3 id="totalRestaurants">0</h3>
        </div>

        <div class="stat-card">
            <span>Active</span>

        <div class="stat-card">

    <!-- ADD RESTAURANT -->

    <section class="section">

        <div class="section-header">

        <form id="restaurantForm">

            <div class="form-grid">

                <div class="form-group">
                    <label for="restaurantName">

                    <input
                        type="text"

                        placeholder="Restaurant name"

                    >
                </div>

                <div class="form-group">
                    <label for="ownerName">
                        Owner Name
                    </label>

                    <input
                        type="text"
                        id="ownerName"
                        placeholder="Owner name"

                    >

                <div class="form-group">
                    <label for="restaurantUsername">
                        Login Username
                    </label>

                    <input

                        Subscription Start

                    >

                <div class="form-group">

    <section class="section">

            </div>

</main>

<script>

    /* =========================================================
       RESTAURANTPRO SUPABASE CONFIGURATION
    ========================================================= */

    const SUPABASE_URL =
        "https://ryixnwawmtglcibjmhjh.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_zcD4aBCDk1yz8RFD1JoBqA_aToCuo7k";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    /* =========================================================
       UI HELPERS
    ========================================================= */

    function showError(message) {

        const errorElement =
            document.getElementById("errorMessage");

        const successElement =
            document.getElementById("successMessage");

        if (successElement) {
            successElement.style.display = "none";
        }

        if (errorElement) {
            errorElement.textContent = message;
            errorElement.style.display = "block";
        }
    }


    function showSuccess(message) {

        const errorElement =
            document.getElementById("errorMessage");

        const successElement =
            document.getElementById("successMessage");

        if (errorElement) {
            errorElement.style.display = "none";
        }

        if (successElement) {
            successElement.textContent = message;
            successElement.style.display = "block";
        }
    }


    function clearMessages() {

        const errorElement =
            document.getElementById("errorMessage");

        const successElement =
            document.getElementById("successMessage");

        if (errorElement) {
            errorElement.style.display = "none";
        }

        if (successElement) {
            successElement.style.display = "none";
        }
    }


    /* =========================================================
       ADMIN AUTH CHECK
    ========================================================= */

    async function checkAdminAccess() {

        const {
            data: {
                session
            },
            error: sessionError
        } = await supabaseClient.auth.getSession();


        if (sessionError) {

            console.error(sessionError);

            showError(
                "Could not verify your login session."
            );

            return false;

        }


        if (!session) {

            window.location.href =
                "admin-login.html";

            return false;

        }


        const {
            data: adminRecord,
            error: adminError
        } = await supabaseClient
            .from("admin_users")
            .select("user_id")
            .eq("user_id", session.user.id)
            .maybeSingle();


        if (adminError) {

            console.error(adminError);

            showError(
                "Could not verify Super Admin permissions."
            );

            return false;

        }


        if (!adminRecord) {

            await supabaseClient.auth.signOut();

            alert(
                "This account is not authorized as Super Admin."
            );

            window.location.href =
                "admin-login.html";

            return false;

        }


        return true;

    }


    /* =========================================================
       LOGOUT
    ========================================================= */

    async function logoutAdmin() {

        await supabaseClient.auth.signOut();

        window.location.href =
            "admin-login.html";

    }


    /* =========================================================
       LOAD RESTAURANTS
    ========================================================= */

    async function getRestaurants() {

        const {
            data,
            error
        } = await supabaseClient
            .from("restaurants")
            .select("*")
            .order("created_at", {
                ascending: false
            });


        if (error) {

            console.error(
                "Could not load restaurants:",
                error
            );

            showError(
                "Could not load restaurants. Please check Supabase policies."
            );

            return [];

        }


        return data || [];

    }


    /* =========================================================
       UPDATE STATS
    ========================================================= */

    async function updateRestaurantStats() {

        const restaurants =
            await getRestaurants();


        const total =
            restaurants.length;


        const active =
            restaurants.filter(function (restaurant) {

                return restaurant.status === "active";

            }).length;


        const blocked =
            restaurants.filter(function (restaurant) {

                return restaurant.status === "blocked";

            }).length;


        const unpaid =
            restaurants.filter(function (restaurant) {

                return restaurant.payment_status === "unpaid";

            }).length;


        document.getElementById(
            "totalRestaurants"
        ).textContent = total;


        document.getElementById(
            "activeRestaurants"
        ).textContent = active;


        document.getElementById(
            "blockedRestaurants"
        ).textContent = blocked;


        document.getElementById(
            "unpaidRestaurants"
        ).textContent = unpaid;

    }


    /* =========================================================
       ESCAPE HTML
    ========================================================= */

    function escapeHTML(value) {

        const div =
            document.createElement("div");

        div.textContent =
            value == null
                ? ""
                : String(value);

        return div.innerHTML;

    }


    /* =========================================================
       RENDER RESTAURANT LIST
    ========================================================= */

    async function renderRestaurantList() {

        const container =
            document.getElementById(
                "restaurantList"
            );


        if (!container) {
            return;
        }


        container.innerHTML = `
            <div class="loading">
                Loading restaurants...
            </div>
        `;


        const restaurants =
            await getRestaurants();


        if (restaurants.length === 0) {

            container.innerHTML = `

                <div class="empty-state">

                    <div class="icon">
                        🍽️
                    </div>

                    <p>
                        No restaurants added yet.
                    </p>

                </div>

            `;

            return;

        }


        container.innerHTML =
            restaurants.map(function (restaurant) {

                const isBlocked =
                    restaurant.status === "blocked";


                const statusClass =
                    isBlocked
                        ? "status-blocked"
                        : "status-active";


                const paymentClass =
                    restaurant.payment_status === "paid"
                        ? "payment-paid"
                        : "payment-unpaid";


                return `

                    <div class="restaurant-item">

                        <div class="restaurant-name">
                            ${escapeHTML(
                                restaurant.restaurant_name
                            )}
                        </div>

                        <div class="restaurant-detail">
                            Owner:
                            ${escapeHTML(
                                restaurant.owner_name
                            )}
                        </div>

                        <div class="restaurant-detail">
                            Username:
                            ${escapeHTML(
                                restaurant.username
                            )}
                        </div>

                        <div class="restaurant-detail">
                            Monthly Fee:
                            Rs.
                            ${Number(
                                restaurant.monthly_fee || 0
                            ).toLocaleString()}
                        </div>

                        <div class="restaurant-detail">
                            Subscription:
                            ${escapeHTML(
                                restaurant.subscription_start
                            )}
                            to
                            ${escapeHTML(
                                restaurant.subscription_expiry
                            )}
                        </div>

                        <div class="restaurant-detail">

                            Status:

                            <span class="${statusClass}">
                                ${
                                    isBlocked
                                        ? "Blocked"
                                        : "Active"
                                }
                            </span>

                        </div>

                        <div class="restaurant-detail">

                            Payment:

                            <span class="${paymentClass}">
                                ${escapeHTML(
                                    restaurant.payment_status
                                )}
                            </span>

                        </div>

                        <div class="restaurant-actions">

                            <button
                                type="button"
                                class="${
                                    isBlocked
                                        ? "unblock-btn"
                                        : "block-btn"
                                }"
                                onclick="toggleRestaurantStatus('${restaurant.id}')"
                            >
                                ${
                                    isBlocked
                                        ? "Unblock"
                                        : "Block"
                                }
                            </button>

                            <button
                                type="button"
                                class="payment-btn"
                                onclick="togglePaymentStatus('${restaurant.id}')"
                            >
                                ${
                                    restaurant.payment_status === "paid"
                                        ? "Mark Unpaid"
                                        : "Mark Paid"
                                }
                            </button>

                        </div>

                    </div>

                `;

            }).join("");

    }


    /* =========================================================
       BLOCK / UNBLOCK RESTAURANT
    ========================================================= */

    async function toggleRestaurantStatus(id) {

        clearMessages();


        const restaurants =
            await getRestaurants();


        const restaurant =
            restaurants.find(function (item) {

                return item.id === id;

            });


        if (!restaurant) {

            showError(
                "Restaurant not found."
            );

            return;

        }


        const newStatus =
            restaurant.status === "active"
                ? "blocked"
                : "active";


        const {
            error
        } = await supabaseClient
            .from("restaurants")
            .update({
                status: newStatus
            })
            .eq("id", id);


        if (error) {

            console.error(error);

            showError(
                "Could not change restaurant status: " +
                error.message
            );

            return;

        }


        showSuccess(
            newStatus === "blocked"
                ? "Restaurant login has been blocked."
                : "Restaurant login has been unblocked."
        );


        await renderRestaurantList();

        await updateRestaurantStats();

    }


    /* =========================================================
       PAYMENT STATUS
    ========================================================= */

    async function togglePaymentStatus(id) {

        clearMessages();


        const restaurants =
            await getRestaurants();


        const restaurant =
            restaurants.find(function (item) {

                return item.id === id;

            });


        if (!restaurant) {

            showError(
                "Restaurant not found."
            );

            return;

        }


        const newPaymentStatus =
            restaurant.payment_status === "paid"
                ? "unpaid"
                : "paid";


        const {
            error
        } = await supabaseClient
            .from("restaurants")
            .update({
                payment_status: newPaymentStatus
            })
            .eq("id", id);


        if (error) {

            console.error(error);

            showError(
                "Could not update payment status: " +
                error.message
            );

            return;

        }


        showSuccess(
            newPaymentStatus === "paid"
                ? "Payment marked as paid."
                : "Payment marked as unpaid."
        );


        await renderRestaurantList();

        await updateRestaurantStats();

    }


    /* =========================================================
       CREATE RESTAURANT
    ========================================================= */

    document.addEventListener(
        "DOMContentLoaded",
        async function () {

            const hasAccess =
                await checkAdminAccess();


            if (!hasAccess) {
                return;
            }


            const restaurantForm =
                document.getElementById(
                    "restaurantForm"
                );


            if (!restaurantForm) {
                return;
            }


            restaurantForm.addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();

                    clearMessages();


                    const button =
                        document.getElementById(
                            "createRestaurantButton"
                        );


                    button.disabled = true;

                    button.textContent =
                        "Creating...";


                    try {

                        const restaurantName =
                            document
                                .getElementById(
                                    "restaurantName"
                                )
                                .value
                                .trim();


                        const ownerName =
                            document
                                .getElementById(
                                    "ownerName"
                                )
                                .value
                                .trim();


                        const username =
                            document
                                .getElementById(
                                    "restaurantUsername"
                                )
                                .value
                                .trim();


                        const password =
                            document
                                .getElementById(
                                    "restaurantPassword"
                                )
                                .value;


                        const monthlyFee =
                            Number(
                                document
                                    .getElementById(
                                        "monthlyFee"
                                    )
                                    .value
                            ) || 0;


                        const subscriptionStart =
                            document
                                .getElementById(
                                    "subscriptionStart"
                                )
                                .value;


                        const subscriptionExpiry =
                            document
                                .getElementById(
                                    "subscriptionExpiry"
                                )
                                .value;


                        if (
                            !restaurantName ||
                            !ownerName ||
                            !username ||
                            !password ||
                            !subscriptionStart ||
                            !subscriptionExpiry
                        ) {

                            showError(
                                "Please fill all required fields."
                            );

                            return;

                        }


                        if (
                            subscriptionExpiry <
                            subscriptionStart
                        ) {

                            showError(
                                "Subscription expiry cannot be before the start date."
                            );

                            return;

                        }


                        /*
                         IMPORTANT:
                         This temporary database insert is only for the
                         restaurant record.

                         Restaurant authentication will be connected
                         to Supabase Auth in the next step.
                        */

                        const {
                            data: existingRestaurant,
                            error: usernameCheckError
                        } = await supabaseClient
                            .from("restaurants")
                            .select("id")
                            .ilike("username", username)
                            .maybeSingle();


                        if (usernameCheckError) {

                            /*
                             PGRST116 is ignored because maybeSingle()
                             should normally avoid it, but we keep this
                             check defensive.
                            */

                            console.error(
                                usernameCheckError
                            );

                        }


                        if (existingRestaurant) {

                            showError(
                                "This login username already exists. Please use another username."
                            );

                            return;

                        }


                        /*
                         WARNING:
                         Do NOT use this password field for the final
                         restaurant login system.

                         The next step will move authentication to
                         Supabase Auth so passwords are securely managed.
                        */

                        const {
                            error
                        } = await supabaseClient
                            .from("restaurants")
                            .insert({
                                restaurant_name:
                                    restaurantName,

                                owner_name:
                                    ownerName,

                                username:
                                    username,

                                password:
                                    password,

                                monthly_fee:
                                    monthlyFee,

                                subscription_start:
                                    subscriptionStart,

                                subscription_expiry:
                                    subscriptionExpiry,

                                status:
                                    "active",

                                payment_status:
                                    "unpaid"
                            });


                        if (error) {

                            console.error(error);

                            showError(
                                "Could not create restaurant: " +
                                error.message
                            );

                            return;

                        }


                        restaurantForm.reset();


                        showSuccess(
                            "Restaurant created successfully."
                        );


                        await renderRestaurantList();

                        await updateRestaurantStats();

                    } finally {

                        button.disabled = false;

                        button.textContent =
                            "Create Restaurant";

                    }

                }
            );


            await updateRestaurantStats();

            await renderRestaurantList();

        }
    );

</script>

</body>
