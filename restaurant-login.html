<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RestaurantPro - Restaurant Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f7f7f7;

        .login-card {
            width: 100%;

        .logo {

        h1 {

            opacity: .65;

            display: none;

        }

            margin-top: 22px;

        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">🍽️</div>

    <h1>Restaurant Login</h1>

    <p class="subtitle">
        RestaurantPro Management
    </p>

    <div id="message" class="message"></div>

    <form id="restaurantLoginForm">

        <div class="form-group">
            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >
        </div>

        <button
            type="submit"
            id="loginButton"
        >
            Login
        </button>

    </form>

    <div class="footer">
        RestaurantPro
    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    /* =========================
       SUPABASE CONFIG
    ========================= */

    const SUPABASE_URL =
        "https://ryixnwawmtglcibjmhjh.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_zcD4aBCDk1yz8RFD1JoBqA_aToCuo7k";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    /* =========================
       ELEMENTS
    ========================= */

    const form =
        document.getElementById(
            "restaurantLoginForm"
        );

    const emailInput =
        document.getElementById(
            "email"
        );

    const passwordInput =
        document.getElementById(
            "password"
        );

    const loginButton =
        document.getElementById(
            "loginButton"
        );

    const message =
        document.getElementById(
            "message"
        );


    /* =========================
       MESSAGE
    ========================= */

    function showMessage(
        text,
        type
    ) {

        message.textContent = text;

        message.className =
            "message " + type;

        message.style.display =
            "block";

    }


    function hideMessage() {

        message.style.display =
            "none";

    }


    /* =========================
       LOGIN
    ========================= */

    form.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            hideMessage();

            const email =
                emailInput.value
                    .trim()
                    .toLowerCase();

            const password =
                passwordInput.value;


            if (!email || !password) {

                showMessage(
                    "Please enter email and password.",
                    "error"
                );

                return;

            }


            loginButton.disabled =
                true;

            loginButton.textContent =
                "Checking...";


            try {

                /*
                 * First authenticate the user
                 * with Supabase Auth.
                 */

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });


                if (error) {

                    showMessage(
                        "Invalid email or password.",
                        "error"
                    );

                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "Login";

                    return;

                }


                if (!data.user) {

                    showMessage(
                        "Login failed. Please try again.",
                        "error"
                    );

                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "Login";

                    return;

                }


                /*
                 * Find the restaurant connected
                 * to this authenticated user.
                 */

                const {
                    data: restaurant,
                    error: restaurantError
                } =
                    await supabaseClient
                        .from("restaurants")
                        .select(
                            "id, restaurant_name, owner_name, status, payment_status, subscription_start, subscription_expiry"
                        )
                        .eq(
                            "auth_user_id",
                            data.user.id
                        )
                        .maybeSingle();


                if (restaurantError) {

                    await supabaseClient.auth.signOut();

                    console.error(
                        restaurantError
                    );

                    showMessage(
                        "Could not verify restaurant account.",
                        "error"
                    );

                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "Login";

                    return;

                }


                if (!restaurant) {

                    await supabaseClient.auth.signOut();

                    showMessage(
                        "Restaurant account is not connected. Please contact administrator.",
                        "error"
                    );

                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "Login";

                    return;

                }


                /*
                 * BLOCKED CHECK
                 */

                if (
                    restaurant.status !==
                    "active"
                ) {

                    await supabaseClient.auth.signOut();

                    showMessage(
                        "Account Suspended. Please contact the administrator.",
                        "error"
                    );

                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "Login";

                    return;

                }


                /*
                 * SUBSCRIPTION EXPIRY CHECK
                 */

                if (
                    restaurant.subscription_expiry
                ) {

                    const today =
                        new Date();

                    const expiry =
                        new Date(
                            restaurant.subscription_expiry +
                            "T23:59:59"
                        );


                    if (
                        expiry < today
                    ) {

                        await supabaseClient.auth.signOut();

                        showMessage(
                            "Your subscription has expired. Please contact the administrator.",
                            "error"
                        );

                        loginButton.disabled =
                            false;

                        loginButton.textContent =
                            "Login";

                        return;

                    }

                }


                /*
                 * SAVE BASIC SESSION INFO
                 */

                localStorage.setItem(
                    "restaurantpro_restaurant_id",
                    restaurant.id
                );

                localStorage.setItem(
                    "restaurantpro_restaurant_name",
                    restaurant.restaurant_name
                );


                showMessage(
                    "Login successful. Opening dashboard...",
                    "success"
                );


                setTimeout(
                    function () {

                        window.location.href =
                            "index.html";

                    },
                    500
                );

            } catch (error) {

                console.error(
                    error
                );

                showMessage(
                    "Something went wrong. Please try again.",
                    "error"
                );

                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Login";

            }

        }
    );

</script>

</body>
</html>
