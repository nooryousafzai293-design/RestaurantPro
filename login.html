<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RestaurantPro - Restaurant Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial;background:linear-gradient(135deg,#fff7f2,#f6f7f9);padding:15px}
.card{width:100%;max-width:410px;padding:35px;background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.10)}
.logo{text-align:center;font-size:44px;margin-bottom:10px}
h1{text-align:center;font-size:26px}
.sub{text-align:center;color:#777;font-size:14px;margin-bottom:28px}
label{display:block;margin-bottom:7px;font-size:14px;font-weight:600}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:9px;margin-bottom:18px;background:#eaf2ff}
button{width:100%;padding:14px;border:none;border-radius:9px;background:#e85b22;color:#fff;font-weight:600;cursor:pointer;font-size:15px}
.error,.success{display:none;margin-bottom:15px;padding:11px;border-radius:8px;font-size:14px}
.error{background:#ffe8e8;color:#c62828}.success{background:#e8f7ee;color:#237447}
.admin-link{display:block;text-align:center;margin-top:16px;color:#e85b22;font-size:14px;text-decoration:none}
.support-box{margin-top:22px;padding:14px;background:#fff7f2;border:1px solid #ffe2d0;border-radius:10px;text-align:center;font-size:13px;line-height:1.7;color:#555}
.support-box b{color:#222}
.support-box a{color:#0b7a3e;font-weight:700;text-decoration:none}
.support-box a.email-link{color:#e85b22}
</style>
</head>
<body>
<div class="card">
<div class="logo">🍽️</div>
<h1>Restaurant Login</h1>
<p class="sub">RestaurantPro</p>
<div id="err" class="error"></div>
<div id="ok" class="success"></div>
<form id="form">
<label>Email</label>
<input type="email" id="email" placeholder="owner@example.com" required>
<label>Password</label>
<input type="password" id="pass" placeholder="••••••••" required>
<button id="btn" type="submit">Login</button>
</form>
<a class="admin-link" href="admin-login.html">Super Admin Login</a>

<!-- CUSTOMER SUPPORT -->
<div class="support-box">
<b>Need Help?</b><br>
For customer support please drop a text message on WhatsApp<br>
<a href="https://wa.me/923175121763" target="_blank">📱 WhatsApp: 03175121763</a><br>
or Email<br>
<a class="email-link" href="mailto:nooryousafzai293@gmail.com">✉️ nooryousafzai293@gmail.com</a>
</div>

</div>
<script>
const supabaseClient = supabase.createClient("https://ryixnwawmtglcibjmhjh.supabase.co","sb_publishable_zcD4aBCDk1yz8RFD1JoBqA_aToCuo7k");
const form=document.getElementById("form"),err=document.getElementById("err"),ok=document.getElementById("ok"),btn=document.getElementById("btn");
function showErr(m){err.textContent=m;err.style.display="block";ok.style.display="none";}
function showOk(m){ok.textContent=m;ok.style.display="block";err.style.display="none";}
async function checkSession(){
  const {data}=await supabaseClient.auth.getSession();
  if(!data.session) return;
  // Agar pehle se login hai to dashboard pe bhej do
  location.href="index.html";
}
checkSession();
form.addEventListener("submit",async(e)=>{
 e.preventDefault();
 const email=document.getElementById("email").value.trim().toLowerCase(),password=document.getElementById("pass").value;
 if(!email||!password) return showErr("Please enter email and password.");
 btn.disabled=true;btn.textContent="Logging in...";
 try{
  const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error) return showErr("Invalid email or password. For help, contact support below.");
  // Restaurant blocked hai ya nahi, check karo
  const {data:rest}=await supabaseClient.from("restaurants").select("status").eq("user_id",data.user.id).maybeSingle();
  if(rest && String(rest.status).toLowerCase()==="blocked"){
    await supabaseClient.auth.signOut();
    return showErr("Your account is blocked. Please contact support on WhatsApp.");
  }
  showOk("Login successful. Opening dashboard...");
  setTimeout(()=>location.href="index.html",500);
 }catch{showErr("Something went wrong. Please contact support.");}
 finally{btn.disabled=false;btn.textContent="Login";}
});
</script>
</body>
</html>
