<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestaurantPro - Login</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff4ed, #ffe1d2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 5px;
        }

        h1 {
            text-align: center;
            margin: 0;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin: 8px 0 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #e85b22;
        }

        .login-button,
        .reset-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #e85b22;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-button:hover,
        .reset-button:hover {
            background: #d94f19;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .forgot-link {
            display: block;
            text-align: right;
            margin-top: -8px;
            margin-bottom: 18px;
            color: #e85b22;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .error-message,
        .success-message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }

        .error-message {
            background: #ffe5e5;
            color: #c62828;
        }

        .success-message {
            background: #e8f7ee;
            color: #237447;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #999;
            font-size: 13px;
        }

        /* Reset Password Box */
        #resetBox {
            display: none;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #e85b22;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo">🍽️</div>
    <h1>RestaurantPro</h1>

    <!-- LOGIN BOX -->
    <div id="loginBox">
        <div class="subtitle">Restaurant Login</div>
        <form id="restaurantLoginForm">
            <div class="form-group">
                <label for="username">Login Email</label>
                <input type="email" id="username" placeholder="Enter login email" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required>
            </div>
            <a href="#" class="forgot-link" id="forgotPasswordLink">Forgot Password?</a>
            <button type="submit" class="login-button" id="loginButton">Login</button>
            <div id="loginError" class="error-message"></div>
            <div id="loginSuccess" class="success-message"></div>
        </form>
    </div>

    <!-- FORGOT PASSWORD BOX -->
    <div id="resetBox">
        <div class="subtitle">Reset Your Password</div>
        <form id="forgotPasswordForm">
            <div class="form-group">
                <label for="resetEmail">Login Email</label>
                <input type="email" id="resetEmail" placeholder="Enter your login email" autocomplete="email" required>
            </div>
            <button type="submit" class="reset-button" id="resetButton">Send Reset Link</button>
            <div id="resetError" class="error-message"></div>
            <div id="resetSuccess" class="success-message"></div>
        </form>
        <a href="#" class="back-link" id="backToLogin">← Back to Login</a>
    </div>

    <div class="footer">RestaurantPro</div>
</div>

<script>
    const SUPABASE_URL = "https://supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_zcD4aBCDk1yz8RFD1JoBqA_aToCuo7k";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    /* ========================= LOGIN ELEMENTS ========================= */
    const loginBox = document.getElementById("loginBox");
    const resetBox = document.getElementById("resetBox");
    const form = document.getElementById("restaurantLoginForm");
    const loginButton = document.getElementById("loginButton");
    const errorBox = document.getElementById("loginError");
    const successBox = document.getElementById("loginSuccess");

    /* ========================= RESET ELEMENTS ========================= */
    const forgotPasswordLink = document.getElementById("forgotPasswordLink");
    const backToLogin = document.getElementById("backToLogin");
    const forgotPasswordForm = document.getElementById("forgotPasswordForm");
    const resetButton = document.getElementById("resetButton");
    const resetEmail = document.getElementById("resetEmail");
    const resetError = document.getElementById("resetError");
    const resetSuccess = document.getElementById("resetSuccess");

    /* ========================= MESSAGE FUNCTIONS ========================= */
    function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = "block";
        successBox.style.display = "none";
    }

    function showSuccess(message) {
        successBox.textContent = message;
        successBox.style.display = "block";
        errorBox.style.display = "none";
    }

    function showResetError(message) {
        resetError.textContent = message;
        resetError.style.display = "block";
        resetSuccess.style.display = "none";
    }

    function showResetSuccess(message) {
        resetSuccess.textContent = message;
        resetSuccess.style.display = "block";
        resetError.style.display = "none";
    }

    /* ========================= SHOW FORGOT PASSWORD ========================= */
    forgotPasswordLink.addEventListener("click", function(event) {
        event.preventDefault();
        const currentEmail = document.getElementById("username").value.trim();
        if (currentEmail) {
            resetEmail.value = currentEmail;
        }
        loginBox.style.display = "none";
        resetBox.style.display = "block";
        resetError.style.display = "none";
        resetSuccess.style.display = "none";
    });

    /* ========================= BACK TO LOGIN ========================= */
    backToLogin.addEventListener("click", function(event) {
        event.preventDefault();
        resetBox.style.display = "none";
        loginBox.style.display = "block";
        resetError.style.display = "none";
        resetSuccess.style.display = "none";
    });

    /* ========================= SEND PASSWORD RESET LOGIC ========================= */
    forgotPasswordForm.addEventListener("submit", async function(event) {
        event.preventDefault();
        
        const email = resetEmail.value.trim();
        resetButton.disabled = true;
        resetButton.textContent = "Sending...";
        
        try {
            const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                redirectTo: "https://github.io"
            });
            
            if (error) {
                showResetError(error.message);
            } else {
                showResetSuccess("Password reset link has been sent to your email!");
            }
        } catch (err) {
            showResetError("Something went wrong. Please try again.");
        } finally {
            resetButton.disabled = false;
            resetButton.textContent = "Send Reset Link";
        }
    });
</script>
</body>
</html>
