
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestaurantPro - Reset Password</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff4ed, #ffe1d2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,.12);
    }

    .logo {
      text-align: center;
      font-size: 42px;
      margin-bottom: 5px;
    }

    h1 {
      text-align: center;
      margin: 0;
      color: #222;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin: 8px 0 28px;
    }

    .form-group { margin-bottom: 18px; }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    input:focus { border-color: #e85b22; }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #e85b22;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: #d94f19; }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .error {
      background: #ffe5e5;
      color: #c62828;
    }

    .success {
      background: #e8f7ee;
      color: #237447;
    }

    .login-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #d94f19;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="logo">🍽️</div>
    <h1>RestaurantPro</h1>
    <div class="subtitle">Set New Password</div>

    <form id="resetForm">
      <div class="form-group">
        <label for="password">New Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter new password"
          minlength="6"
          autocomplete="new-password"
          required
          disabled
        >
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm New Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm new password"
          minlength="6"
          autocomplete="new-password"
          required
          disabled
        >
      </div>

      <button type="submit" id="resetButton" disabled>
        Verify Reset Link...
      </button>

      <div id="message" class="message" role="status" aria-live="polite"></div>
    </form>

    <a class="login-link" href="login.html">Back to Login</a>
  </div>

  <script>
    const SUPABASE_URL =
      "https://ryixnwawmtglcibjmhjh.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_zcD4aBCDk1yz8RFD1JoBqA_aToCuo7k";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
          flowType: "implicit"
        }
      }
    );

    const form = document.getElementById("resetForm");
    const button = document.getElementById("resetButton");
    const message = document.getElementById("message");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirmPassword");

    let recoveryReady = false;
    let isUpdating = false;

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
      message.style.display = "block";
    }

    function setFormEnabled(enabled) {
      recoveryReady = enabled;

      passwordInput.disabled = !enabled;
      confirmInput.disabled = !enabled;
      button.disabled = !enabled || isUpdating;

      button.textContent = enabled
        ? "Update Password"
        : "Verify Reset Link...";
    }

    function getUrlError() {
      const query = new URLSearchParams(window.location.search);
      const hash = new URLSearchParams(
        window.location.hash.replace(/^#/, "")
      );

      return {
        error:
          query.get("error") ||
          hash.get("error"),

        code:
          query.get("error_code") ||
          hash.get("error_code"),

        description:
          query.get("error_description") ||
          hash.get("error_description")
      };
    }

    function showInvalidLink(text) {
      setFormEnabled(false);

      showMessage(
        text ||
        "This password reset link is invalid or has expired. Please request a new recovery email.",
        "error"
      );
    }

    // Listen for Supabase authentication events.
    // Do not call other Supabase auth methods inside this callback.
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" && session) {
        setFormEnabled(true);
        message.style.display = "none";
      }

      if (
        event === "SIGNED_OUT" &&
        !isUpdating
      ) {
        setFormEnabled(false);
      }
    });

    async function initializePage() {
      setFormEnabled(false);

      const urlError = getUrlError();

      if (urlError.error) {
        let description = urlError.description || "";

        try {
          description = decodeURIComponent(description.replace(/\+/g, " "));
        } catch (_) {
          // Keep the original description if decoding fails.
        }

        showInvalidLink(
          description ||
          "This password reset link is invalid or has expired. Please request a new email."
        );
        return;
      }

      try {
        // Supabase JS initializes and processes supported URL tokens.
        const { data, error } =
          await supabaseClient.auth.getSession();

        if (error) {
          throw error;
        }

        if (data.session) {
          setFormEnabled(true);
          message.style.display = "none";
          return;
        }

        showInvalidLink(
          "No valid recovery session was found. Please open the newest password reset email and click its link once."
        );
      } catch (error) {
        console.error("Recovery initialization error:", error);

        showInvalidLink(
          "Unable to verify the reset link. Please request a new recovery email."
        );
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!recoveryReady || isUpdating) {
        showMessage(
          "Please open a valid password reset link first.",
          "error"
        );
        return;
      }

      const password = passwordInput.value;
      const confirmPassword = confirmInput.value;

      if (password.length < 6) {
        showMessage(
          "Password must be at least 6 characters.",
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage(
          "The passwords do not match.",
          "error"
        );
        return;
      }

      isUpdating = true;
      button.disabled = true;
      button.textContent = "Updating...";

      try {
        // Verify that the recovery session still exists.
        const { data: sessionData, error: sessionError } =
          await supabaseClient.auth.getSession();

        if (sessionError) {
          throw sessionError;
        }

        if (!sessionData.session) {
          throw new Error(
            "Your recovery session has expired. Please request a new reset email."
          );
        }

        const { error: updateError } =
          await supabaseClient.auth.updateUser({
            password: password
          });

        if (updateError) {
          throw updateError;
        }

        // Clear the password fields after a successful update.
        passwordInput.value = "";
        confirmInput.value = "";

        showMessage(
          "Password updated successfully! Redirecting to login...",
          "success"
        );

        setFormEnabled(false);
        button.textContent = "Password Updated";

        // Sign out after changing the password.
        const { error: signOutError } =
          await supabaseClient.auth.signOut();

        if (signOutError) {
          console.warn("Sign-out warning:", signOutError);
        }

        window.setTimeout(() => {
          window.location.replace("login.html");
        }, 1800);

      } catch (error) {
        console.error("Password update error:", error);

        showMessage(
          error.message || "Unable to update your password.",
          "error"
        );

        button.textContent = "Update Password";
        button.disabled = false;

      } finally {
        isUpdating = false;

        if (recoveryReady) {
          button.disabled = false;
          button.textContent = "Update Password";
        }
      }
    });

    initializePage();
  </script>
</body>
</html>
