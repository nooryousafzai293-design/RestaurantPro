<body>

<div class="card">

    <div class="logo">🍽️</div>

    <h1>RestaurantPro</h1>

    <div class="subtitle">
        Set New Password
    </div>

    <form id="resetForm">

        <div class="form-group">
            <label for="password">
                New Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter new password"
                minlength="6"
                autocomplete="new-password"
                required
            >
        </div>

        <div class="form-group">
            <label for="confirmPassword">
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                minlength="6"
                autocomplete="new-password"
                required
            >
        </div>

        <button
            type="submit"
            id="resetButton"
        >
            Update Password
        </button>

        <div
            id="message"
            class="message"
        ></div>

    </form>

<script>

const SUPABASE_URL =
    "https://ryixnwawmtglcibjmhjh.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_zcD4aBCDk1yz8RFD1JoBqA_aToCuo7k";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


const form =
    document.getElementById("resetForm");

const button =
    document.getElementById("resetButton");

const message =
    document.getElementById("message");


function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display = "block";
}


function getRecoveryError() {

    const hash =
        window.location.hash;

    const params =
        new URLSearchParams(
            hash.replace(/^#/, "")
        );

    return {
        error:
            params.get("error"),

        errorCode:
            params.get("error_code"),

        errorDescription:
            params.get("error_description")
    };
}


async function checkRecoverySession() {

    try {

        const recoveryError =
            getRecoveryError();

        if (recoveryError.error) {

            showMessage(
                recoveryError.errorDescription
                ? decodeURIComponent(
                    recoveryError.errorDescription
                )
                : "This password reset link is invalid or expired.",
                "error"
            );

            button.disabled = true;

            return false;
        }


        const {
            data,
            error
        } =
            await supabaseClient.auth.getSession();


        if (error) {

            console.error(
                "Session error:",
                error
            );

            showMessage(
                "Unable to verify the password reset session.",
                "error"
            );

            button.disabled = true;

            return false;
        }


        if (!data.session) {

            showMessage(
                "This password reset link is invalid or has expired. Please request a new password recovery email.",
                "error"
            );

            button.disabled = true;

            return false;
        }


        return true;

    } catch (error) {

        console.error(
            "Recovery session error:",
            error
        );

        showMessage(
            "Unable to verify the password reset link.",
            "error"
        );

        button.disabled = true;

        return false;
    }
}


supabaseClient.auth.onAuthStateChange(
    async function(event, session) {

        console.log(
            "Auth event:",
            event
        );

        if (
            event === "PASSWORD_RECOVERY" &&
            session
        ) {

            button.disabled = false;

            message.style.display =
                "none";
        }

    }
);


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        message.style.display =
            "none";


        const password =
            document.getElementById(
                "password"
            ).value;

        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            ).value;


        if (password.length < 6) {

            showMessage(
                "Password must be at least 6 characters.",
                "error"
            );

            return;
        }


        if (password !== confirmPassword) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;
        }


        button.disabled = true;

        button.textContent =
            "Updating...";


        try {

            const {
                data: sessionData,
                error: sessionError
            } =
                await supabaseClient.auth.getSession();


            if (
                sessionError ||
                !sessionData.session
            ) {

                throw new Error(
                    "Password reset session is missing or expired. Please request a new recovery email."
                );
            }


            const {
                error
            } =
                await supabaseClient.auth.updateUser({
                    password: password
                });


            if (error) {

                throw error;
            }


            showMessage(
                "Password updated successfully! Redirecting to login...",
                "success"
            );


            await supabaseClient.auth.signOut();


            setTimeout(
                function() {

                    window.location.replace(
                        "login.html"
                    );

                },
                1500
            );


        } catch (error) {

            console.error(
                "Password update error:",
                error
            );

            showMessage(
                error.message ||
                "Unable to update password.",
                "error"
            );

            button.disabled = false;

            button.textContent =
                "Update Password";
        }

    }
);


document.addEventListener(
    "DOMContentLoaded",
    async function() {

        await checkRecoverySession();

    }
);

</script>

</body>
