<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RestaurantPro - Reset Password</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff4ed, #ffe1d2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 5px;
        }

        h1 {
            text-align: center;
            margin: 0;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin: 8px 0 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #e85b22;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #e85b22;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #d94f19;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }

        .error {
            background: #ffe5e5;
            color: #c62828;
        }

        .success {
            background: #e8f7ee;
            color: #237447;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">🍽️</div>

    <h1>RestaurantPro</h1>

    <div class="subtitle">
        Set New Password
    </div>

    <form id="resetForm">

        <div class="form-group">
            <label for="password">
                New Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter new password"
                minlength="6"
                autocomplete="new-password"
                required
            >
        </div>

        <div class="form-group">
            <label for="confirmPassword">
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                minlength="6"
                autocomplete="new-password"
                required
            >
        </div>

        <button
            type="submit"
            id="resetButton"
        >
            Update Password
        </button>

        <div
            id="message"
            class="message"
        ></div>

    </form>

</div>

<script>

const SUPABASE_URL =
    "https://ryixnwawmtglcibjmhjh.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_zcD4aBCDk1yz8RFD1JoBqA_aToCuo7k";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


const form =
    document.getElementById("resetForm");

const button =
    document.getElementById("resetButton");

const message =
    document.getElementById("message");


function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display = "block";
}


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        message.style.display = "none";

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;


        if (password.length < 6) {

            showMessage(
                "Password must be at least 6 characters.",
                "error"
            );

            return;
        }


        if (password !== confirmPassword) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;
        }


        button.disabled = true;

        button.textContent =
            "Updating...";


        try {

            const {
                error
            } =
                await supabaseClient.auth.updateUser({
                    password: password
                });


            if (error) {

                throw error;
            }


            showMessage(
                "Password updated successfully! Redirecting to login...",
                "success"
            );


            setTimeout(function() {

                window.location.replace(
                    "login.html"
                );

            }, 1500);


        } catch (error) {

            console.error(
                "Password update error:",
                error
            );

            showMessage(
                error.message ||
                "Unable to update password.",
                "error"
            );

            button.disabled = false;

            button.textContent =
                "Update Password";
        }

    }
);

</script>

</body>
</html>
