<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RestaurantPro - Super Admin Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff7f2, #f6f7f9);
        }

        .login-card {
            width: 100%;
            max-width: 410px;
            margin: 20px;
            padding: 35px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, .10);
        }

        .logo {
            text-align: center;
            font-size: 44px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #222;
            font-size: 26px;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #e85b22;
            box-shadow: 0 0 0 3px rgba(232, 91, 34, .10);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #e85b22;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #d94f19;
        }

        button:disabled {
            opacity: .65;
            cursor: not-allowed;
        }

        .error {
            display: none;
            margin-bottom: 15px;
            padding: 11px;
            border-radius: 8px;
            background: #ffe8e8;
            color: #c62828;
            font-size: 14px;
        }

        .success {
            display: none;
            margin-bottom: 15px;
            padding: 11px;
            border-radius: 8px;
            background: #e8f7ee;
            color: #237447;
            font-size: 14px;
        }

        .footer {
            margin-top: 22px;
            text-align: center;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">🍽️</div>

    <h1>Super Admin</h1>

    <p class="subtitle">
        RestaurantPro Management
    </p>

    <div id="loginError" class="error"></div>

    <div id="loginSuccess" class="success"></div>

    <form id="adminLoginForm">

        <div class="form-group">

            <label for="adminEmail">
                Admin Email
            </label>

            <input
                type="email"
                id="adminEmail"
                placeholder="Enter admin email"
                autocomplete="email"
                required
            >

        </div>

        <div class="form-group">

            <label for="adminPassword">
                Password
            </label>

            <input
                type="password"
                id="adminPassword"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >

        </div>

        <button
            type="submit"
            id="loginButton"
        >
            Login
        </button>

    </form>

    <div class="footer">
        RestaurantPro Super Admin
    </div>

</div>


<script>

const SUPABASE_URL =
    "https://ryixnwawmtglcibjmhjh.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_zcD4aBCDk1yz8RFD1JoBqA_aToCuo7k";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


const loginForm =
    document.getElementById("adminLoginForm");

const emailInput =
    document.getElementById("adminEmail");

const passwordInput =
    document.getElementById("adminPassword");

const loginButton =
    document.getElementById("loginButton");

const loginError =
    document.getElementById("loginError");

const loginSuccess =
    document.getElementById("loginSuccess");


function showError(message) {

    loginError.textContent = message;
    loginError.style.display = "block";

    loginSuccess.textContent = "";
    loginSuccess.style.display = "none";
}


function showSuccess(message) {

    loginSuccess.textContent = message;
    loginSuccess.style.display = "block";

    loginError.textContent = "";
    loginError.style.display = "none";
}


function hideMessages() {

    loginError.textContent = "";
    loginError.style.display = "none";

    loginSuccess.textContent = "";
    loginSuccess.style.display = "none";
}


/* =========================================
   CHECK EXISTING LOGIN
========================================= */

async function checkExistingSession() {

    try {

        const {
            data,
            error
        } =
        await supabaseClient.auth.getSession();


        if (error) {

            console.error(
                "Session error:",
                error
            );

            return;
        }


        const session =
            data.session;


        if (!session) {
            return;
        }


        const {
            data: adminRecord,
            error: adminError
        } =
        await supabaseClient
            .from("admin_users")
            .select("user_id")
            .eq(
                "user_id",
                session.user.id
            )
            .maybeSingle();


        if (adminError) {

            console.error(
                "Admin check error:",
                adminError
            );

            return;
        }


        if (adminRecord) {

            window.location.href =
                "admin.html";
        }

    } catch (error) {

        console.error(
            "Session check failed:",
            error
        );
    }
}


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        hideMessages();


        const email =
            emailInput.value
                .trim()
                .toLowerCase();

        const password =
            passwordInput.value;


        if (!email || !password) {

            showError(
                "Please enter your email and password."
            );

            return;
        }


        loginButton.disabled = true;

        loginButton.textContent =
            "Logging in...";


        try {

            /* LOGIN WITH SUPABASE */

            const {
                data,
                error
            } =
            await supabaseClient.auth
                .signInWithPassword({
                    email: email,
                    password: password
                });


            if (error) {

                console.error(
                    "Login error:",
                    error
                );

                showError(
                    "Invalid email or password."
                );

                return;
            }


            const user =
                data.user;


            if (!user) {

                await supabaseClient.auth
                    .signOut();

                showError(
                    "Login failed. Please try again."
                );

                return;
            }


            /* CHECK SUPER ADMIN */

            const {
                data: adminRecord,
                error: adminError
            } =
            await supabaseClient
                .from("admin_users")
                .select("user_id")
                .eq(
                    "user_id",
                    user.id
                )
                .maybeSingle();


            if (adminError) {

                console.error(
                    "Admin verification error:",
                    adminError
                );


                await supabaseClient.auth
                    .signOut();


                showError(
                    "Could not verify Super Admin access."
                );

                return;
            }


            /* NOT ADMIN */

            if (!adminRecord) {

                await supabaseClient.auth
                    .signOut();


                showError(
                    "This account is not authorized as Super Admin."
                );

                return;
            }


            /* SUCCESS */

            showSuccess(
                "Login successful. Opening dashboard..."
            );


            setTimeout(
                function() {

                    window.location.href =
                        "admin.html";

                },
                500
            );

        } catch (error) {

            console.error(
                "Unexpected login error:",
                error
            );

            showError(
                "Something went wrong. Please try again."
            );

        } finally {

            loginButton.disabled = false;

            loginButton.textContent =
                "Login";
        }

    }
);


/* =========================================
   START
========================================= */

checkExistingSession();

</script>

</body>
</html>
