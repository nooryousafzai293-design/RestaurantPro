<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RestaurantPro - Super Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial;background:linear-gradient(135deg,#fff7f2,#f6f7f9)}
.card{width:100%;max-width:410px;margin:20px;padding:35px;background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.10)}
.logo{text-align:center;font-size:44px;margin-bottom:10px}
h1{text-align:center;font-size:26px} .sub{text-align:center;color:#777;font-size:14px;margin-bottom:28px}
label{display:block;margin-bottom:7px;font-size:14px;font-weight:600}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:9px;margin-bottom:18px}
button{width:100%;padding:14px;border:none;border-radius:9px;background:#e85b22;color:#fff;font-weight:600;cursor:pointer}
.error,.success{display:none;margin-bottom:15px;padding:11px;border-radius:8px;font-size:14px}
.error{background:#ffe8e8;color:#c62828}.success{background:#e8f7ee;color:#237447}
</style>
</head>
<body>
<div class="card">
<div class="logo">🍽️</div><h1>Super Admin</h1><p class="sub">RestaurantPro Management</p>
<div id="err" class="error"></div><div id="ok" class="success"></div>
<form id="form">
<label>Admin Email</label><input type="email" id="email" required>
<label>Password</label><input type="password" id="pass" required>
<button id="btn" type="submit">Login</button>
</form>
</div>
<script>
const supabaseClient=supabase.createClient("https://ryixnwawmtglcibjmhjh.supabase.co","sb_publishable_zcD4aBCDk1yz8RFD1JoBqA_aToCuo7k");
const form=document.getElementById("form"),err=document.getElementById("err"),ok=document.getElementById("ok"),btn=document.getElementById("btn");
function showErr(m){err.textContent=m;err.style.display="block";ok.style.display="none";}
function showOk(m){ok.textContent=m;ok.style.display="block";err.style.display="none";}
async function checkSession(){const {data}=await supabaseClient.auth.getSession();if(!data.session)return;const {data:r}=await supabaseClient.from("admin_users").select("user_id").eq("user_id",data.session.user.id).maybeSingle();if(r)location.href="admin.html";}
checkSession();
form.addEventListener("submit",async(e)=>{
 e.preventDefault();
 const email=document.getElementById("email").value.trim().toLowerCase(),password=document.getElementById("pass").value;
 if(!email||!password)return showErr("Please enter email and password.");
 btn.disabled=true;btn.textContent="Logging in...";
 try{
  const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error)return showErr("Invalid email or password.");
  const {data:admin,error:aErr}=await supabaseClient.from("admin_users").select("user_id").eq("user_id",data.user.id).maybeSingle();
  if(aErr){await supabaseClient.auth.signOut();return showErr("Could not verify Super Admin access.");}
  if(!admin){await supabaseClient.auth.signOut();return showErr("This account is not authorized as Super Admin.");}
  showOk("Login successful. Opening dashboard...");setTimeout(()=>location.href="admin.html",500);
 }catch{showErr("Something went wrong.");}
 finally{btn.disabled=false;btn.textContent="Login";}
});
</script>
